<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DilKholSafe - 'हमराज़' एडमिन पोर्टल VIP</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://meet.jit.si/external_api.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #05070f; color: #f8fafc; }
        .glass-panel { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .neon-glow-rose { box-shadow: 0 0 35px -5px rgba(244, 63, 94, 0.4); }
        .neon-glow-emerald { box-shadow: 0 0 35px -5px rgba(16, 185, 129, 0.45); }
    </style>
</head>
<body class="min-h-screen p-3 sm:p-5 select-none">

    <audio id="incomingRinger" loop src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"></audio>

    <!-- Passcode -->
    <div id="loginArea" class="max-w-sm mx-auto my-16 glass-panel p-6 rounded-3xl space-y-5 text-center neon-glow-rose border border-rose-500/30">
        <div class="w-16 h-16 bg-gradient-to-tr from-rose-600 to-pink-500 rounded-2xl flex items-center justify-center mx-auto shadow-xl">
            <span class="text-3xl">🔒</span>
        </div>
        <div>
            <h1 class="text-xl font-black text-white">DilKholSafe Admin</h1>
            <p class="text-xs text-rose-400 font-semibold mt-1">सुरक्षित 'हमराज़' कंट्रोल एक्सेस</p>
        </div>
        <input type="password" id="adminPass" placeholder="पासवर्ड (100399)" class="w-full bg-slate-900/90 border border-slate-700/80 rounded-xl p-3 text-center text-lg text-white focus:outline-none">
        <button onclick="loginAdmin()" class="w-full bg-gradient-to-r from-rose-600 to-pink-600 text-white font-extrabold py-3.5 rounded-xl uppercase text-xs">🚀 कंट्रोल रूम खोलें</button>
    </div>

    <!-- Dashboard -->
    <div id="dashboardArea" class="hidden max-w-4xl mx-auto space-y-4">
        <header class="glass-panel p-4 sm:p-5 rounded-3xl flex justify-between items-center border border-rose-500/30 neon-glow-rose">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 bg-gradient-to-tr from-rose-600 to-amber-400 rounded-2xl flex items-center justify-center"><span class="text-2xl">❤️</span></div>
                <div>
                    <h1 class="text-lg font-black text-white">'हमराज़' VIP कंट्रोल रूम</h1>
                    <p class="text-[10px] text-emerald-400 font-bold flex items-center gap-1 mt-0.5"><span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span> लाइव सिस्टम एक्टिव है</p>
                </div>
            </div>
            <button onclick="logoutAdmin()" class="bg-rose-950/80 border border-rose-500/40 text-rose-300 text-xs px-3.5 py-2.5 rounded-xl font-bold">🚪 बाहर जाएँ</button>
        </header>

        <div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5">
            <div class="glass-panel p-3.5 rounded-2xl border border-rose-500/20 text-center"><p class="text-[10px] text-slate-400 font-bold">कुल बुकिंग्स</p><h3 id="statTotal" class="text-2xl font-black text-rose-400">0</h3></div>
            <div class="glass-panel p-3.5 rounded-2xl border border-emerald-500/20 text-center"><p class="text-[10px] text-slate-400 font-bold">वॉइस कॉल्स</p><h3 id="statCalls" class="text-2xl font-black text-emerald-400">0</h3></div>
            <div class="glass-panel p-3.5 rounded-2xl border border-sky-500/20 text-center"><p class="text-[10px] text-slate-400 font-bold">लाइव चैट्स</p><h3 id="statChats" class="text-2xl font-black text-sky-400">0</h3></div>
            <div class="glass-panel p-3.5 rounded-2xl border border-amber-500/20 text-center"><p class="text-[10px] text-slate-400 font-bold">एक्टिव रिव्यूज</p><h3 id="statReviews" class="text-2xl font-black text-amber-400">22</h3></div>
        </div>

        <div id="incomingAlertBar" class="hidden glass-panel p-4 rounded-2xl border-2 border-emerald-500 neon-glow-emerald bg-emerald-950/50 animate-pulse flex justify-between items-center">
            <div>
                <h2 class="text-sm font-black text-emerald-400">नया कस्टमर कॉल पर वेट कर रहा है!</h2>
                <p id="callingCustInfo" class="text-xs text-slate-200 font-bold">निकनेम: Guest</p>
            </div>
            <button onclick="acceptLiveCall()" class="bg-emerald-500 text-slate-950 font-black px-6 py-3 rounded-xl text-xs uppercase">📲 कनेक्ट करें</button>
        </div>

        <div id="adminCallContainer" class="hidden glass-panel p-3 rounded-2xl border border-rose-500/50 space-y-2">
            <div class="flex justify-between items-center px-2">
                <span class="text-xs font-bold text-rose-400">🔴 लाइव ऑडियो काउंसलिंग चालू है...</span>
                <button onclick="endAdminCall()" class="bg-rose-600 text-white text-[10px] px-3 py-1 rounded-lg font-bold">कॉल समाप्त करें</button>
            </div>
            <div id="adminCallRoom" class="w-full h-80 rounded-xl overflow-hidden bg-slate-950"></div>
        </div>

        <div class="glass-panel p-4 rounded-3xl space-y-3">
            <h2 class="text-xs font-black text-slate-200 uppercase border-b border-slate-800 pb-2">📥 हाल की बुकिंग्स</h2>
            <div id="bookingsList" class="space-y-2 max-h-96 overflow-y-auto"></div>
        </div>
    </div>

    <script>
        let jitsiApi = null;
        let ringer = document.getElementById('incomingRinger');

        function loginAdmin() {
            if(document.getElementById('adminPass').value === "100399") { 
                localStorage.setItem('dks_admin_logged', 'true');
                showDashboard();
            } else { alert("गलत पासवर्ड!"); }
        }

        if(localStorage.getItem('dks_admin_logged') === 'true') showDashboard();

        function showDashboard() {
            document.getElementById('loginArea').classList.add('hidden');
            document.getElementById('dashboardArea').classList.remove('hidden');
            loadDashboardData();
            setInterval(loadDashboardData, 3000);
        }

        function logoutAdmin() { localStorage.removeItem('dks_admin_logged'); location.reload(); }

        function loadDashboardData() {
            let bookings = JSON.parse(localStorage.getItem('dks_bookings')) || [];
            document.getElementById('statTotal').innerText = bookings.length;
            document.getElementById('statCalls').innerText = bookings.filter(b => b.mode === 'Voice Call').length;
            document.getElementById('statChats').innerText = bookings.filter(b => b.mode === 'Chat').length;

            let bList = document.getElementById('bookingsList');

            if(bookings.length > 0 && bookings[0].mode === "Voice Call" && !bookings[0].handled) {
                document.getElementById('incomingAlertBar').classList.remove('hidden');
                document.getElementById('callingCustInfo').innerText = `निकनेम: ${bookings[0].nickName} | फोन: ${bookings[0].phone} | विषय: ${bookings[0].topic}`;
                try { ringer.play(); } catch(e){}
            } else {
                document.getElementById('incomingAlertBar').classList.add('hidden');
                ringer.pause();
            }

            bList.innerHTML = bookings.length ? bookings.map((b) => `
                <div class="bg-slate-900/90 p-3.5 rounded-2xl border border-slate-800 space-y-2">
                    <div class="flex justify-between">
                        <span class="text-xs font-black text-rose-400">${b.realName} (${b.nickName})</span>
                        <span class="text-[10px] text-emerald-400 bg-emerald-950 px-2 py-0.5 rounded-full">${b.selectedMinutes} मिनट</span>
                    </div>
                    <div class="text-[11px] text-slate-300 flex justify-between"><span>📞 ${b.phone}</span><span>${b.time}</span></div>
                    <div class="text-[10px] text-slate-400 border-t border-slate-800 pt-2 flex justify-between items-center">
                        <span>विषय: ${b.topic}</span>
                        ${b.mode === 'Voice Call' ? `<button onclick="acceptLiveCall('${b.roomId}')" class="bg-emerald-500 text-slate-950 font-bold px-3 py-1 rounded-lg text-[10px]">📞 कनेक्ट करें</button>` : `<span class="text-sky-400 font-bold">💬 चैट</span>`}
                    </div>
                </div>
            `).join('') : `<p class="text-center text-slate-500 text-xs py-6">कोई बुकिंग नहीं है।</p>`;
        }

        function acceptLiveCall(roomId) {
            ringer.pause();
            document.getElementById('incomingAlertBar').classList.add('hidden');
            document.getElementById('adminCallContainer').classList.remove('hidden');

            let bookings = JSON.parse(localStorage.getItem('dks_bookings')) || [];
            if(bookings.length > 0) {
                bookings[0].handled = true;
                localStorage.setItem('dks_bookings', JSON.stringify(bookings));
            }

            if(jitsiApi) jitsiApi.dispose();

            const domain = 'meet.jit.si';
            const options = {
                roomName: roomId || bookings[0].roomId,
                width: '100%',
                height: '100%',
                parentNode: document.querySelector('#adminCallRoom'),
                userInfo: { displayName: "हमराज़ (Host)" },
                configOverwrite: {
                    startWithAudioMuted: false,
                    startWithVideoMuted: true,
                    prejoinPageEnabled: false,
                    disableDeepLinking: true
                }
            };

            jitsiApi = new JitsiMeetExternalAPI(domain, options);
        }

        function endAdminCall() {
            if(jitsiApi) { jitsiApi.dispose(); jitsiApi = null; }
            document.getElementById('adminCallContainer').classList.add('hidden');
        }
    </script>
</body>
</html>
