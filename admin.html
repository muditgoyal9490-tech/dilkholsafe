<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DilKholSafe - एडमिन कंट्रोल रूम</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #05070f; color: #f8fafc; }
        .glass-panel { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="min-h-screen p-4 select-none">
    <audio id="ringer" loop src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"></audio>

    <!-- Login -->
    <div id="loginBox" class="max-w-sm mx-auto my-20 glass-panel p-6 rounded-3xl text-center space-y-4">
        <h1 class="text-xl font-black text-white">Admin Login</h1>
        <input type="password" id="pwd" placeholder="पासवर्ड (100399)" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-center text-white">
        <button onclick="login()" class="w-full bg-rose-600 text-white font-bold py-3 rounded-xl uppercase text-xs">लॉगिन</button>
    </div>

    <!-- Panel -->
    <div id="panelBox" class="hidden max-w-2xl mx-auto space-y-4">
        <header class="glass-panel p-4 rounded-2xl flex justify-between items-center">
            <h1 class="font-black text-white">👑 एडमिन लाइव कंट्रोल</h1>
            <button onclick="location.reload()" class="bg-slate-800 text-xs px-3 py-1.5 rounded-lg">रीफ्रेश</button>
        </header>

        <!-- Alert -->
        <div id="alertBox" class="hidden glass-panel p-4 rounded-2xl border-2 border-emerald-500 bg-emerald-950/60 animate-pulse flex justify-between items-center">
            <div>
                <h3 class="font-black text-emerald-400 text-sm">🚨 नया कस्टमर आ गया है!</h3>
                <p id="alertDetails" class="text-xs text-slate-200">नाम व विषय</p>
            </div>
            <button onclick="acceptCall()" class="bg-emerald-500 text-slate-950 font-black px-4 py-2 rounded-xl text-xs uppercase">📲 स्वीकार करें</button>
        </div>

        <!-- Active Chat Control -->
        <div id="adminChatBox" class="hidden glass-panel p-4 rounded-2xl space-y-3">
            <h3 class="text-xs font-black text-sky-400 uppercase">💬 लाइव चैट विंडो</h3>
            <div id="adminChatMsgs" class="h-48 overflow-y-auto space-y-1 p-2 bg-slate-950 rounded-lg text-xs"></div>
            <div class="flex gap-2">
                <input type="text" id="adminInput" placeholder="रिप्लाई लिखें..." class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-xs text-white">
                <button onclick="sendAdminMsg()" class="bg-emerald-600 text-white text-xs px-4 py-2 rounded-xl font-bold">भेजें</button>
            </div>
        </div>
    </div>

    <script>
        function login() {
            if(document.getElementById('pwd').value === "100399") {
                document.getElementById('loginBox').classList.add('hidden');
                document.getElementById('panelBox').classList.remove('hidden');
                checkData();
                setInterval(checkData, 2000);
            } else { alert("गलत पासवर्ड"); }
        }

        function checkData() {
            let data = JSON.parse(localStorage.getItem('dks_current_booking'));
            let isNew = localStorage.getItem('dks_new_alert');

            if(data && isNew === 'true') {
                document.getElementById('alertBox').classList.remove('hidden');
                document.getElementById('alertDetails').innerText = `${data.realName} (${data.nickName}) - ${data.topic} [${data.mode}]`;
                try{ document.getElementById('ringer').play(); }catch(e){}
            } else {
                document.getElementById('alertBox').classList.add('hidden');
                document.getElementById('ringer').pause();
            }

            if(data && data.accepted && data.mode === 'Chat') {
                document.getElementById('adminChatBox').classList.remove('hidden');
                let html = "";
                if(data.messages) {
                    data.messages.forEach(m => {
                        html += `<div class="${m.sender === 'Admin' ? 'text-emerald-400 text-right' : 'text-sky-400 text-left'} font-medium">${m.sender}: ${m.text}</div>`;
                    });
                }
                document.getElementById('adminChatMsgs').innerHTML = html;
            }
        }

        function acceptCall() {
            document.getElementById('ringer').pause();
            document.getElementById('alertBox').classList.add('hidden');
            localStorage.setItem('dks_new_alert', 'false');

            let data = JSON.parse(localStorage.getItem('dks_current_booking'));
            if(data) {
                data.accepted = true;
                localStorage.setItem('dks_current_booking', JSON.stringify(data));
                if(data.mode === 'Chat') {
                    document.getElementById('adminChatBox').classList.remove('hidden');
                    alert("चैट कनेक्ट हो गई है! अब आप नीचे से मैसेज भेज सकते हैं।");
                } else {
                    alert("कॉल स्वीकार कर ली गई है!");
                }
            }
        }

        function sendAdminMsg() {
            let text = document.getElementById('adminInput').value.trim();
            if(!text) return;
            let data = JSON.parse(localStorage.getItem('dks_current_booking'));
            if(data) {
                if(!data.messages) data.messages = [];
                data.messages.push({ sender: 'Admin', text: text });
                localStorage.setItem('dks_current_booking', JSON.stringify(data));
                document.getElementById('adminInput').value = "";
            }
        }
    </script>
</body>
</html>
