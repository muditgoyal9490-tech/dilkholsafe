<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DilKholSafe - 'हमराज़' एडमिन ऐप</title>
    <!-- App Like Settings -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0f172a">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://meet.jit.si/external_api.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .neon-border-rose { box-shadow: 0 0 15px rgba(244, 63, 94, 0.3); }
        .neon-border-emerald { box-shadow: 0 0 20px rgba(16, 185, 129, 0.5); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-3 sm:p-5 select-none">

    <!-- Audio Alert for Incoming Calls -->
    <audio id="incomingRinger" loop src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"></audio>

    <!-- 1. Passcode Screen -->
    <div id="loginArea" class="max-w-sm mx-auto my-16 glass-panel p-6 rounded-3xl space-y-5 text-center neon-border-rose">
        <div class="w-16 h-16 bg-rose-600/20 border border-rose-500/40 rounded-2xl flex items-center justify-center mx-auto shadow-inner">
            <span class="text-3xl">🔒</span>
        </div>
        <div>
            <h1 class="text-xl font-extrabold text-white tracking-wide">DilKholSafe Admin</h1>
            <p class="text-xs text-rose-400 font-medium mt-1">सुरक्षित हमराज़ कंट्रोल एक्सेस</p>
        </div>
        <input type="password" id="adminPass" placeholder="पासवर्ड (100399)" class="w-full bg-slate-900/90 border border-slate-700/80 rounded-xl p-3 text-center text-lg tracking-widest text-white focus:outline-none focus:border-rose-500 transition">
        <button onclick="loginAdmin()" class="w-full bg-gradient-to-r from-rose-600 to-pink-600 hover:from-rose-500 hover:to-pink-500 text-white font-bold py-3 rounded-xl shadow-lg shadow-rose-950/50 transition active:scale-95 text-sm">
            🚀 कंट्रोल रूम खोलें
        </button>
    </div>

    <!-- 2. Main App Dashboard -->
    <div id="dashboardArea" class="hidden max-w-4xl mx-auto space-y-4">

        <!-- Top Navigation Bar -->
        <header class="glass-panel p-4 rounded-2xl flex justify-between items-center shadow-lg">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-rose-600 rounded-xl flex items-center justify-center shadow-md shadow-rose-900/50">
                    <span class="text-xl">❤️</span>
                </div>
                <div>
                    <h1 class="text-base font-extrabold text-white leading-tight">हमराज़ पोर्टल</h1>
                    <p class="text-[10px] text-emerald-400 font-semibold flex items-center gap-1">
                        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span> लाइव कंट्रोल ऑनलाइन
                    </p>
                </div>
            </div>
            <button onclick="logoutAdmin()" class="bg-slate-800 border border-slate-700 text-slate-300 text-xs px-3 py-2 rounded-xl font-semibold hover:bg-rose-950/40 hover:text-rose-400 transition">
                🚪 बाहर जाएं
            </button>
        </header>

        <!-- Live Incoming Call Alert Bar (Hidden by default) -->
        <div id="incomingAlertBar" class="hidden glass-panel p-4 rounded-2xl border-2 border-emerald-500 neon-border-emerald bg-emerald-950/30 animate-pulse flex flex-col sm:flex-row justify-between items-center gap-3">
            <div class="flex items-center gap-3 text-center sm:text-left">
                <span class="text-3xl animate-bounce">📞</span>
                <div>
                    <h2 class="text-sm font-bold text-emerald-400">नया कस्टमर कॉलिंग रूम में वेट कर रहा है!</h2>
                    <p id="callingCustInfo" class="text-xs text-slate-300">नाम: Guest | विषय: लव लाइफ</p>
                </div>
            </div>
            <button onclick="acceptLiveCall()" class="w-full sm:w-auto bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black px-5 py-2.5 rounded-xl shadow-lg transition active:scale-95 text-xs">
                📲 अभी कॉल कनेक्ट करें
            </button>
        </div>

        <!-- Live Call Stream Window -->
        <div id="adminCallContainer" class="hidden glass-panel p-3 rounded-2xl border border-rose-500/50 space-y-2">
            <div class="flex justify-between items-center px-2">
                <span class="text-xs font-bold text-rose-400 flex items-center gap-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-rose-500 animate-pulse"></span> ऑडियो बातचीत जारी है...
                </span>
                <button onclick="endAdminCall()" class="bg-rose-600 text-white text-[11px] px-3 py-1 rounded-lg font-bold">कॉल कट करें</button>
            </div>
            <div id="adminCallRoom" class="w-full h-80 rounded-xl overflow-hidden bg-slate-950 border border-slate-800"></div>
        </div>

        <!-- Active Customer Booking Cards -->
        <section class="glass-panel p-4 rounded-2xl space-y-3">
            <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                <h2 class="text-xs font-bold text-slate-200 tracking-wider uppercase">📥 हाल की बुकिंग्स (Live Sync)</h2>
                <span id="bookingCount" class="bg-rose-600/20 text-rose-400 text-[10px] px-2 py-0.5 rounded-full font-extrabold border border-rose-500/30">0 कुल</span>
            </div>

            <div id="bookingsList" class="space-y-2 max-h-80 overflow-y-auto pr-1">
                <!-- Bookings injected dynamically -->
            </div>
        </section>

        <!-- Manage Reviews Section -->
        <section class="glass-panel p-4 rounded-2xl space-y-3">
            <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                <h2 class="text-xs font-bold text-slate-200 tracking-wider uppercase">⭐ वेबसाइट रिव्यूज मैनेजमेंट (20+ Reviews)</h2>
                <button onclick="addNewAdminReview()" class="bg-slate-800 hover:bg-slate-700 text-rose-400 text-[11px] px-2.5 py-1 rounded-lg border border-slate-700 font-semibold">
                    ➕ नया रिव्यू जोड़ें
                </button>
            </div>
            <div id="adminReviewsList" class="space-y-2 max-h-60 overflow-y-auto pr-1">
                <!-- Reviews injected -->
            </div>
        </section>

    </div>

    <!-- App Engine Logic -->
    <script>
        let jitsiApi = null;
        let ringer = document.getElementById('incomingRinger');

        const fullDefaultReviews = [
            { name: "अनन्या एस.", msg: "गर्लफ्रेंड से शारीरिक विषय पर बात करने में बहुत झिझक थी, यहाँ 'हमराज़' से खुलकर बात हुई। मन हल्का हो गया।" },
            { name: "स्नेहा (गेस्ट)", msg: "100% सुरक्षित प्लेटफॉर्म! पहचान पूरी तरह गुप्त रही और बहुत अच्छी सलाह मिली।" },
            { name: "पूजा शर्मा", msg: "शादीशुदा जिंदगी के निजी डाउट्स दूर हुए। बिना डर के अपनी बात रख पाई।" },
            { name: "राहुल एम.", msg: "ब्रेकअप के बाद बहुत अकेलापन था, यहाँ बात करके मन शांत हुआ।" },
            { name: "प्रिया वी.", msg: "लड़कियों के लिए यह सबसे सुरक्षित जगह है अपनी सीक्रेट बातें करने के लिए।" },
            { name: "महक के.", msg: "एंग्जाइटी और ओवरथिंकिंग कम हो गई। बहुत दोस्ताना अनुभव रहा।" },
            { name: "रितु सिंह", msg: "मुझे बहुत डर लग रहा था पर यहाँ बात करके बहुत सहज महसूस हुआ।" },
            { name: "नेहा जी.", msg: "100% गोपनीयता की गारंटी है। कोई भी बेझिझक बात कर सकता है।" },
            { name: "अदिति रॉय", msg: "अपनी पहली रिलेशनशिप की उलझन यहाँ शेयर की। बहुत प्रैक्टिकल गाइडेंस मिली।" },
            { name: "दिव्या के.", msg: "कॉल पर बात करके लगा ही नहीं कि किसी अनजान से बात हो रही है, एकदम दोस्त जैसा माहौल था।" },
            { name: "साक्षी पटेल", msg: "मन में बहुत भारीपन था, आधे घंटे के सेशन में मन एकदम हल्का हो गया।" },
            { name: "मुस्कान जे.", msg: "बिना किसी जजमेंट के मेरी पूरी बात सुनी गई। थैंक यू दिल खोल सेफ़!" },
            { name: "दुग्गू (गेस्ट)", msg: "पर्सनल लाइफ की उलझन सुलझ गई। सर्विस बहुत ही बढ़िया है।" },
            { name: "सिमरन कौर", msg: "प्राइवेसी को लेकर मन में शक था, पर यहाँ नाम भी निकनेम यूज़ होता है तो एकदम सेफ़ लगा।" },
            { name: "काजल एम.", msg: "मानसिक तनाव से राहत मिली। काउंसलर/हमराज़ का व्यवहार बहुत सपोर्टिव है।" },
            { name: "अंजलि गुप्ता", msg: "यौन स्वास्थ्य और झिझक पर खुलकर सलाह मिली। बहुत मददगार।" },
            { name: "पिंकी आर.", msg: "अकेलेपन से डिप्रेशन हो रहा था, यहाँ बात करके जीने की नई उम्मीद मिली।" },
            { name: "विकास यादव", msg: "करियर और लव लाइफ का स्ट्रेस कम हुआ। बहुत अच्छा लिसनर है।" },
            { name: "स्वाति शर्मा", msg: "अपनी लाइफ का सबसे बड़ा सीक्रेट यहाँ शेयर किया, बिल्कुल सुरक्षित महसूस हुआ।" },
            { name: "रिद्धिमा वी.", msg: "15 मिनट का सेशन लिया था, पर पूरा पैसा वसूल रहा। ज़रूर ट्राई करें।" },
            { name: "अतिथि (गेस्ट गर्ल)", msg: "लड़कियों के लिए पूरी तरह प्राइवेट और सम्मानजनक माहौल है।" }
        ];

        function loginAdmin() {
            let pass = document.getElementById('adminPass').value;
            if(pass === "100399") { 
                localStorage.setItem('dks_admin_logged', 'true');
                showDashboard();
            } else {
                alert("गलत पासवर्ड!");
                document.getElementById('adminPass').value = "";
            }
        }

        if(localStorage.getItem('dks_admin_logged') === 'true') {
            showDashboard();
        }

        function showDashboard() {
            document.getElementById('loginArea').classList.add('hidden');
            document.getElementById('dashboardArea').classList.remove('hidden');
            loadDashboardData();
            setInterval(loadDashboardData, 3000); // Auto-Refresh every 3 Seconds
        }

        function logoutAdmin() {
            localStorage.removeItem('dks_admin_logged');
            location.reload();
        }

        function loadDashboardData() {
            // Load Bookings
            let bookings = JSON.parse(localStorage.getItem('dks_bookings')) || [];
            document.getElementById('bookingCount').innerText = `${bookings.length} कुल`;
            
            let bList = document.getElementById('bookingsList');

            if(bookings.length > 0 && bookings[0].mode === "Voice Call" && !bookings[0].handled) {
                // Trigger Ringing Alert
                document.getElementById('incomingAlertBar').classList.remove('hidden');
                document.getElementById('callingCustInfo').innerText = `निकनेम: ${bookings[0].nickName} | फोन: ${bookings[0].phone} | विषय: ${bookings[0].topic}`;
                try { ringer.play(); } catch(e){}
            } else {
                document.getElementById('incomingAlertBar').classList.add('hidden');
                ringer.pause();
            }

            bList.innerHTML = bookings.length ? bookings.map((b, i) => `
                <div class="bg-slate-900/90 p-3 rounded-xl border border-slate-800 space-y-1.5">
                    <div class="flex justify-between items-start">
                        <div>
                            <span class="text-xs font-bold text-rose-400">${b.realName}</span>
                            <span class="text-[10px] text-slate-400 ml-1">(${b.nickName})</span>
                        </div>
                        <span class="text-[10px] text-emerald-400 font-bold bg-emerald-950/60 px-2 py-0.5 rounded-full border border-emerald-500/30">${b.selectedMinutes} मिनट</span>
                    </div>
                    <div class="text-[11px] text-slate-300 flex justify-between">
                        <span>📞 ${b.phone}</span>
                        <span class="text-slate-400">${b.time}</span>
                    </div>
                    <div class="text-[10px] text-slate-400 border-t border-slate-800/80 pt-1 flex justify-between items-center">
                        <span>विषय: ${b.topic} (${b.mood})</span>
                        ${b.mode === 'Voice Call' ? `<button onclick="acceptLiveCall()" class="bg-emerald-600 text-white font-bold px-2.5 py-1 rounded-lg text-[10px]">📞 कनेक्ट</button>` : `<span class="text-sky-400 font-bold">💬 चैट</span>`}
                    </div>
                </div>
            `).join('') : `<p class="text-center text-slate-500 text-xs py-4">अभी कोई लाइव बुकिंग नहीं है।</p>`;

            // Load Reviews
            let reviews = JSON.parse(localStorage.getItem('dks_reviews')) || fullDefaultReviews;
            let rList = document.getElementById('adminReviewsList');
            rList.innerHTML = reviews.map((r, i) => `
                <div class="flex justify-between items-center bg-slate-900/80 p-2.5 rounded-xl border border-slate-800">
                    <div class="pr-2">
                        <span class="font-bold text-rose-400 text-[11px]">${r.name}:</span>
                        <span class="text-slate-300 text-[10px] ml-1">"${r.msg}"</span>
                    </div>
                    <button onclick="deleteReview(${i})" class="bg-rose-950/50 text-rose-400 hover:bg-rose-600 hover:text-white px-2 py-1 rounded-lg text-[10px] font-bold border border-rose-500/20">❌</button>
                </div>
            `).join('');
        }

        function acceptLiveCall() {
            ringer.pause();
            document.getElementById('incomingAlertBar').classList.add('hidden');
            document.getElementById('adminCallContainer').classList.remove('hidden');

            let bookings = JSON.parse(localStorage.getItem('dks_bookings')) || [];
            if(bookings.length > 0) {
                bookings[0].handled = true;
                localStorage.setItem('dks_bookings', JSON.stringify(bookings));
            }

            if(jitsiApi) jitsiApi.dispose();

            const domain = 'meet.jit.si';
            const roomName = 'DilKholSafe_Private_Room_2026';
            
            const options = {
                roomName: roomName,
                width: '100%',
                height: '100%',
                parentNode: document.querySelector('#adminCallRoom'),
                userInfo: { displayName: "हमराज़ (Host)" },
                configOverwrite: {
                    startWithAudioMuted: false,
                    startWithVideoMuted: true,
                    prejoinPageEnabled: false
                }
            };

            jitsiApi = new JitsiMeetExternalAPI(domain, options);
        }

        function endAdminCall() {
            if(jitsiApi) { jitsiApi.dispose(); jitsiApi = null; }
            document.getElementById('adminCallContainer').classList.add('hidden');
        }

        function deleteReview(index) {
            let reviews = JSON.parse(localStorage.getItem('dks_reviews')) || fullDefaultReviews;
            reviews.splice(index, 1);
            localStorage.setItem('dks_reviews', JSON.stringify(reviews));
            loadDashboardData();
        }

        function addNewAdminReview() {
            let name = prompt("कस्टमर का नाम/निकनेम:");
            let msg = prompt("रिव्यू मैसेज लिखें:");
            if(name && msg) {
                let reviews = JSON.parse(localStorage.getItem('dks_reviews')) || fullDefaultReviews;
                reviews.unshift({ name, msg });
                localStorage.setItem('dks_reviews', JSON.stringify(reviews));
                loadDashboardData();
            }
        }
    </script>
</body>
</html>
