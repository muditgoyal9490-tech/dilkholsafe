<!DOCTYPE html>
<html lang="hi" translate="no" class="notranslate">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="google" content="notranslate">
    <title>DilKholSafe - 'हमराज़' (100% गोपनीय व सुरक्षित प्लेटफॉर्म)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #070a12; color: #f8fafc; }
        .glass-card { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .neon-glow-rose { box-shadow: 0 0 30px -5px rgba(244, 63, 94, 0.4); }
    </style>
</head>
<body class="min-h-screen p-3 sm:p-6 select-none">
    <div class="max-w-3xl mx-auto space-y-6">
        <header class="glass-card p-5 rounded-3xl text-center space-y-3 neon-glow-rose border-rose-500/30">
            <h1 class="text-2xl font-black text-white">DilKholSafe <span class="text-rose-400">हमराज़ VIP</span></h1>
            <p class="text-xs text-slate-300">100% गोपनीय व सुरक्षित ज़ोन - स्क्रीनशॉट व रिकॉर्डिंग प्रतिबंधित</p>
        </header>

        <!-- Booking Form -->
        <section class="glass-card p-5 rounded-3xl space-y-4 border border-rose-500/40">
            <h2 class="text-base font-black text-white text-center">📅 अपना सीक्रेट स्लॉट बुक करें</h2>
            <form id="bookingForm" onsubmit="handleBooking(event)" class="space-y-3">
                <input type="text" id="realName" required placeholder="असली नाम (गुप्त)" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-xs text-white">
                <input type="text" id="nickName" required placeholder="निकनेम (चैट/कॉल पर दिखने के लिए)" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-xs text-white">
                <input type="tel" id="phone" required placeholder="मोबाइल नंबर" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-xs text-white">
                <select id="mode" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-xs text-white">
                    <option value="Voice Call">📞 इन-ऐप ऑडियो कॉल</option>
                    <option value="Chat">💬 इन-ऐप सीक्रेट लाइव चैट</option>
                </select>
                <select id="topic" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-xs text-white">
                    <option value="शारीरिक व यौन झिझक">1. शारीरिक व यौन झिझक</option>
                    <option value="लव लाइफ व रिश्ते">2. लव लाइफ व रिश्ते</option>
                    <option value="तनाव व डिप्रेशन">3. तनाव व डिप्रेशन</option>
                    <option value="पर्सनल राज़">4. पर्सनल सीक्रेट्स</option>
                </select>
                <button type="submit" class="w-full bg-gradient-to-r from-rose-600 to-pink-600 text-white font-black py-3.5 rounded-xl text-xs uppercase">🔒 स्लॉट बुक करें</button>
            </form>

            <!-- Active Session View -->
            <div id="userSessionContainer" class="hidden space-y-3 pt-3 border-t border-slate-800">
                <div class="flex justify-between items-center bg-slate-900 p-3 rounded-xl border border-rose-500/30">
                    <span id="sessionStatusText" class="text-xs font-black text-amber-400 animate-pulse">⏳ एडमिन के कनेक्ट होने का इंतज़ार है...</span>
                    <div class="bg-rose-950 text-rose-300 font-mono text-xs px-3 py-1 rounded-lg">⏱️ <span id="sessionTimer">15:00</span></div>
                    <button onclick="endUserSession()" class="bg-rose-600 text-white text-[10px] px-3 py-1 rounded-lg font-bold">समाप्त</button>
                </div>

                <!-- Chat Box -->
                <div id="userChatRoom" class="hidden glass-card p-3 rounded-xl space-y-2">
                    <div id="chatMessages" class="h-60 overflow-y-auto space-y-2 p-2 bg-slate-950 rounded-lg text-xs">
                        <div class="text-rose-400 font-bold text-[10px]">हमराज़: नमस्कार! बताइए मैं क्या मदद करूँ?</div>
                    </div>
                    <div class="flex gap-2">
                        <input type="text" id="chatInput" placeholder="संदेश लिखें..." class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-xs text-white">
                        <button onclick="sendChatMessage()" class="bg-rose-600 text-white text-xs px-4 py-2.5 rounded-xl font-bold">भेजें</button>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <script>
        let timerInterval = null;
        let activeBId = null;

        function handleBooking(e) {
            e.preventDefault();
            let bId = "BK_" + Date.now();
            activeBId = bId;

            let booking = {
                id: bId,
                realName: document.getElementById('realName').value,
                nickName: document.getElementById('nickName').value,
                phone: document.getElementById('phone').value,
                mode: document.getElementById('mode').value,
                topic: document.getElementById('topic').value,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                accepted: false,
                messages: []
            };

            localStorage.setItem('dks_current_booking', JSON.stringify(booking));
            localStorage.setItem('dks_new_alert', 'true');

            document.getElementById('userSessionContainer').classList.remove('hidden');
            if(booking.mode === 'Chat') document.getElementById('userChatRoom').classList.remove('hidden');

            // Poll for admin acceptance
            let poll = setInterval(() => {
                let data = JSON.parse(localStorage.getItem('dks_current_booking'));
                if(data && data.accepted) {
                    clearInterval(poll);
                    document.getElementById('sessionStatusText').innerText = "🟢 सत्र लाइव कनेक्टेड है!";
                    document.getElementById('sessionStatusText').className = "text-xs font-black text-emerald-400";
                    startTimer(15);
                    if(data.mode === 'Chat') syncChatMessages();
                }
            }, 1500);
        }

        function startTimer(mins) {
            let secs = mins * 60;
            timerInterval = setInterval(() => {
                let m = Math.floor(secs / 60);
                let s = secs % 60;
                document.getElementById('sessionTimer').innerText = (m<10?'0':'')+m + ":" + (s<10?'0':'')+s;
                if(--secs < 0) { clearInterval(timerInterval); alert("समय समाप्त!"); endUserSession(); }
            }, 1000);
        }

        function sendChatMessage() {
            let text = document.getElementById('chatInput').value.trim();
            if(!text) return;
            let data = JSON.parse(localStorage.getItem('dks_current_booking')) || {};
            if(!data.messages) data.messages = [];
            let nick = document.getElementById('nickName').value || "कस्टमर";
            data.messages.push({ sender: nick, text: text });
            localStorage.setItem('dks_current_booking', JSON.stringify(data));
            
            document.getElementById('chatMessages').innerHTML += `<div class="text-right text-sky-400 font-medium">आप: ${text}</div>`;
            document.getElementById('chatInput').value = "";
        }

        function syncChatMessages() {
            setInterval(() => {
                let data = JSON.parse(localStorage.getItem('dks_current_booking'));
                if(data && data.messages) {
                    let html = `<div class="text-rose-400 font-bold text-[10px]">हमराज़: नमस्कार! बताइए मैं क्या मदद करूँ?</div>`;
                    data.messages.forEach(m => {
                        html += `<div class="${m.sender === 'Admin' ? 'text-rose-300 text-left' : 'text-sky-400 text-right'} font-medium">${m.sender}: ${m.text}</div>`;
                    });
                    document.getElementById('chatMessages').innerHTML = html;
                }
            }, 2000);
        }

        function endUserSession() {
            clearInterval(timerInterval);
            localStorage.removeItem('dks_current_booking');
            document.getElementById('userSessionContainer').classList.add('hidden');
            document.getElementById('bookingForm').reset();
        }
    </script>
</body>
</html>
